############################################################
# Codex config.toml for a native Windows 11 environment.
# Shared sections are exported by @peaceroad/ai-dotfiles/export.js.
############################################################

# デフォルトのモデル
model = "gpt-6-astra"

# モデルの推論レベル。モデルによって利用可能な値が異なる。
# "none"、"minimal"、"low"、"medium"、"high"、"xhigh"、"max"、"ultra"
model_reasoning_effort = "medium"

# コミュニケーションスタイル。他に "friendly"、"pragmatic"、"none"
personality = "pragmatic"

# リクエストの処理速度・料金クラス。利用可能な値はモデルやログイン方式によって異なる。
# Fastを既定にする場合は service_tier = "fast" を指定する。利用量も増えるため必要に応じて選ぶ。
# features.fast_mode は現在既定でtrue。選択機能の有効化であり、それだけでFastには切り替わらない。
service_tier = "default"

# 応答時の説明度合。 "low"、"medium"、"high"
model_verbosity = "medium"

# Codexの組み込みベース指示をファイル内容で置き換える。
# このグローバルconfig.tomlでは、相対パスは ~/.codex/ を基準に解決される。
# model_instructions_fileによるベース指示と、AGENTS.mdによるカスタムインストラクションは別レイヤーとして併用される。
# 複数のAGENTS.mdが適用される場合、指示が競合すると対象ファイルに近いプロジェクト側のAGENTS.mdが優先される。
# model_instructions_file = "instructions.md"

# ツールによるWeb検索。ローカルコマンドのネットワーク権限とは別レイヤー。
# disabled: 無効
# cached: OpenAIが事前取得した検索キャッシュを使用
# indexed: 外部Webアクセスが必要な場合も、検索インデックスによるゲートを通す
# live: 最新のWebにアクセス
# 注意：最新情報を取得しなくても済む場合には、cachedなどを十分か検討したほうが安全。
web_search = "live"

# 承認プロセス。
# "untrusted": 信頼済みと判断されないコマンドについて承認を求める
# "on-request": Permission profileの範囲内では実行、範囲外の操作が必要な場合に承認を求める
# "never": 承認を求めない。許可範囲内はそのまま実行し、許可範囲外は承認を求めず失敗する
# 注意：neverでは、許可済みのファイル操作・通信が確認なしで実行される。
# github.comへの通信を許可した認証済み環境では、Git pushなどの外部変更も実行され得る。
approval_policy = "never"

# Permission profileでローカルコマンドのファイルアクセスとネットワークを制御する
default_permissions = "workspace-with-agents"

[features]
# 機能フラグの設定場所として残す。fast_modeやmulti_agentなど、既定で有効な機能は追加指定しない。
# js_replは削除済みの機能フラグなので記載しない。
# 許可ドメインの強制にはnetwork_proxyが必要（管理者設定で有効になる場合を除く）。
# 実験的なため、アプリでの実効設定と通信を確認してから有効にする。
# network_proxy = true

[features.context_management]
# Astraの実験的コンテキスト管理。メモと同じタスクの検索可能な履歴で詳細を保持する。
# 既定はfalse。設定リファレンス上の対象はChatGPTサインインのPlus・Pro・Pro Lite。
# 対応クライアントで有効にし、新しいタスクを開始して利用する。
# https://learn.chatgpt.com/docs/config-file/config-reference

# 安定性を優先して無効化（2026-09-06）。以下のIssueの対応状況を確認して再検討する。
# 閾値の上書きで引き継ぎ指示が欠落: https://github.com/openai/codex/issues/42918
# 圧縮後に未完了の作業が停止: https://github.com/openai/codex/issues/42693
# notes/historyツール不足で作業を反復: https://github.com/openai/codex/issues/42449
# Windows版Astraで圧縮が停止・再発: https://github.com/openai/codex/issues/43062
# Astraで途中停止・圧縮・修正を反復: https://github.com/openai/codex/issues/43103
# 42918は閾値を上書きしない現在の設定では条件外。42693・42449は別モデルまたは旧版の報告。
# 43062・43103は、この実験機能が原因か未確認。
experimental_mode = false

# CodexアプリのWindows環境におけるサンドボックス設定
# elevated: 管理者権限でセットアップする、Codex推奨のWindows隔離方式。
# エージェントのコマンド自体を管理者として実行する意味ではない。
# unelevated: 管理者権限を使えない場合や、elevatedのセットアップに失敗する場合のフォールバック。
# ユーザープロファイル以下の開発ツールは、必要な読み取り・書き込み先をPermission profileで許可する。
# elevatedでも、エージェントのコマンドに管理者権限が付与されるわけではない。
[windows]
sandbox = "elevated"

# エージェント権限 workspace-with-agents の説明
[permissions.workspace-with-agents]
description = "ワークスペース、~/.agents、および許可した開発キャッシュを編集し、通信を許可。ドメイン制限にはプロキシの有効化が必要。 / Edits the workspace, ~/.agents, and approved development caches; allows networking. Domain restrictions require an enabled proxy."

# workspace-with-agents:
# ワークスペース、~/.agents、および許可した開発キャッシュへの書き込みを許可する。
# プロジェクト内の.agents/.codexの保護を解除する個別ルールは、現在は無効。
# 通信を許可する。ドメイン制限の適用条件はnetwork節を参照する。
[permissions.workspace-with-agents.filesystem]
":minimal" = "read"            # Codexや一般的なコマンド実行に必要最低限のシステム領域

# OS一時ディレクトリはワークスペース外にあり、生成物の追跡・後処理がしにくい。
# また、書き込み可能でもサンドボックスにより再帰削除が拒否される場合がある。
# ただ、OpenAI Docsなどの公式ドキュメント取得ツールが標準の一時キャッシュを使用するため、
# このプロファイルではtmpdir全体を許可する。
":tmpdir" = "write"            # $TMPDIR、Windowsでは通常一時ディレクトリ
# ":slash_tmp" = "write"         # /tmpが存在する環境での/tmp

# ":workspace_roots" = "write" # 現在のワークスペースルート（ルートのみの設定なら）

"~/.agents" = "write"          # ユーザープロファイルの.agentsディレクトリ

"~/AppData/Roaming/npm" = "read"            # npmでグローバルインストールしたCLI
"~/AppData/Local/Programs/Python" = "read"  # ユーザー領域にインストールしたPython本体
"~/AppData/Roaming/Python" = "read"         # pip --userでインストールしたパッケージとCLI
"~/AppData/Local/pip/Cache" = "write"       # pipのダウンロード・ビルドキャッシュ。
"~/AppData/Local/npm-cache" = "write"       # npm・npxのキャッシュ
"~/.bun/bin" = "read"                       # Bun本体の実行
"~/.bun/install/cache" = "write"            # パッケージキャッシュは書き込み
"~/.deno/bin" = "read"                      # Deno本体の実行
"~/AppData/Local/deno" = "write"            # Denoの依存関係キャッシュ
"~/AppData/Local/pnpm/store" = "write"      # pnpmのパッケージストアとキャッシュ
"~/AppData/Local/pnpm-cache" = "write"
"~/.local/bin" = "read"                     # uv本体は実行のみ、
"~/AppData/Local/uv/cache" = "write"        # 依存関係キャッシュは書き込み可能

# Java / Mavenを使用する場合に有効化する。
# settings.xmlには認証情報が入る可能性があるため、
# ~/.m2全体ではなく依存関係とWrapperのキャッシュだけを許可する。
# "~/.m2/repository" = "write"
# "~/.m2/wrapper" = "write"

# Java / Gradleを使用する場合に有効化する。
# gradle.propertiesには認証情報が入る可能性があるため、
# ~/.gradle全体ではなく実行に必要なキャッシュ領域だけを許可する。
# "~/.gradle/caches" = "write"
# "~/.gradle/wrapper" = "write"
# "~/.gradle/daemon" = "write"
# "~/.gradle/native" = "write"
# "~/.gradle/notifications" = "write"
# "~/.gradle/jdks" = "write"

# .NET SDK本体はC:\Program Files\dotnetにあり、:minimalによる読み取りで利用できる。
# dotnet restoreがワークスペース外へパッケージを書き込むため、NuGetキャッシュだけ許可する。
"~/.nuget/packages" = "write"

# Rustを導入した場合に有効化する。
# Cargo本体・ツールチェーンは読み取り、依存関係キャッシュは書き込みを許可する。
# "~/.cargo/bin" = "read"
# "~/.rustup" = "read"
# "~/.cargo/registry" = "write"
# "~/.cargo/git" = "write"

# PHP Composerを導入した場合に、実際のキャッシュ位置を確認して有効化する。
# 認証情報を保存するauth.jsonやCOMPOSER_AUTHとは分離すること。
# "~/AppData/Local/Composer" = "write"

# 読み取り拒否用globをサンドボックス起動前に展開する環境での、探索の最大深さ。
# 1以上。read/writeルール全般の探索深度を変更する設定ではない。
# denyの対象が深い階層にある場合に検討する。深くすると起動時のスキャン量も増える。
# glob_scan_max_depth = 3

# `:workspace_roots`は、Codexアプリ・IDE・CLIなどがセッションに渡した
# runtime workspace rootsと、このpermission profileで明示したrootsの集合。
# 複数rootになり得て、以下の相対パス規則は各rootへ個別に適用される。
#
# "."は、有効なすべてのworkspace rootとその配下へのwriteを許可する。
# このセクション自体は、どのディレクトリをrootにするかを決定しない。
[permissions.workspace-with-agents.filesystem.":workspace_roots"]
"." = "write"

# NOTE (2026-07-22):
# Windows版Codexでは、存在しないパスを個別のfilesystem権限として指定すると、
# サンドボックスの権限準備時に、そのパスが空のディレクトリとして
# ワークスペース内へ作成される可能性がある。
#
# 実際に空のドットディレクトリが作成されたため、
# 不要な生成物を避ける目的で、以下の個別パス指定を無効化する。
# 将来のCodex更新でこの挙動が解消された場合、またはfilesystemレベルの
# 強制的なアクセス制限が必要になった場合に、再度有効化を検討する。
# 必要あればプロジェクトの.codex/config.tomlで個別に設定する。

# ".git" = "read"      # status・diff・logなどは可。add・commit・branch・switch・merge・rebaseなど、Gitメタデータを変更する操作は不可

# NOTE: Windows版Codexでは、バージョンやサンドボックス状態によって、
# 保護対象の`.agents`と`.codex`に明示的なwriteルールを設定しても、
# Deny Write ACLが優先される場合がある。

# NOTE: `.agents`自体をwriteにすると、Windows版Codexでは書き込みルートとして
# `.agents/.agents`や`.agents/.codex`などが再帰的に展開される場合がある。
# ループを避けつつ、各ワークスペースの既存`.agents`配下だけを書き込み可能にする。
# ".agents/**" = "write" # デフォルトの保護を明示的に解除する

# NOTE: `.codex`配下には、将来、プロジェクト固有の設定・フック・MCP設定など、
# 次回以降のCodexの動作に影響するファイルが置かれる可能性がある。
# 以下はプロジェクト内のCodex設定も編集可能にする設定例。現在は無効。
# `.codex`自体ではなく配下を指定し、`.codex/.codex`などの再帰展開を避ける。
# ".codex/**" = "write" # デフォルトの保護を明示的に解除する

# .env系ファイルへの読み取りを拒否する設定例。現在はすべて無効。
# この設定のままでは.envファイルへのアクセスを禁止しない。
# 環境変数のfiltersとは別の制御。必要な場合に実環境で動作を確認して有効化する。
# denyでは再帰globを使用できる。
# ".env" = "deny"
# ".env.*" = "deny"
# "**/.env" = "deny"
# "**/.env.*" = "deny"

# ワークスペース直下にある、秘密値を含まないテンプレートだけは
# 具体的なファイル名で読み取り可能にする。
# NOTE: read/writeの再帰globは環境間の移植性が低い。
# 手元のWindows環境では、readに`**/.env.example`を指定しても、
# denyの読み取り例外として期待どおり適用されなかった。
# ".env.example" = "read"
# ".env.sample" = "read"
# ".env.template" = "read"

# サンドボックス内のコマンドによるネットワーク操作に関する設定。
# enabled=trueだけではプロキシは起動しない。features.network_proxy、または管理者設定で
# プロキシが有効な場合に限り、modeとdomainsによる通信先制限が適用される。
# 現在はこのファイルではプロキシを有効化していないため、単体では直接通信を許可する。
# Web検索・Apps・MCPなどの通信は、このドメインリストの制御対象外。
[permissions.workspace-with-agents.network]
enabled = true      # 許可するかどうか。true, false
mode = "limited"    # モード。制限付き（"limited"）、全許可（"full"）
# mode = "full"

# プロキシ有効時に許可するドメインのリスト。常時接続を行う設定ではない。
# 日常的に使う取得先を許可し、追加の配布元やリダイレクト先は必要時に個別に確認する。
# 許可は読み取り専用を意味しない。同じホストへの送信・更新操作も通信可能になる。
[permissions.workspace-with-agents.network.domains]
# GitHub
"github.com" = "allow"
"api.github.com" = "allow"
"raw.githubusercontent.com" = "allow"
"codeload.github.com" = "allow"
"release-assets.githubusercontent.com" = "allow"
"objects.githubusercontent.com" = "allow"

# ドキュメント。
"**.openai.com" = "allow"
"learn.chatgpt.com" = "allow" # Codexの公式ドキュメント
"developer.mozilla.org" = "allow" # HTML・CSS・JavaScriptなどの資料
"nodejs.org" = "allow"            # Node.jsの資料・配布物
"docs.astral.sh" = "allow"        # uvなどの資料
"platform.claude.com" = "allow"
"ai.google.dev" = "allow"
"developers.google.com" = "allow"
"learn.microsoft.com" = "allow"
"developer.apple.com" = "allow"

# npm installを使う場合
"registry.npmjs.org" = "allow"

# Deno / JSR
# "jsr.io" = "allow"
# "npm.jsr.io" = "allow"

# pip installを使う場合
"pypi.org" = "allow"
"files.pythonhosted.org" = "allow"

# Maven Central
# "repo.maven.apache.org" = "allow"

# Gradleを使う場合
# "plugins.gradle.org" = "allow"
# "services.gradle.org" = "allow"
# "plugins-artifacts.gradle.org" = "allow"

# NuGet / .NET
# "api.nuget.org" = "allow"  # dotnet restoreおよびNuGetクライアントが利用するV3 API
# "data.nuget.org" = "allow" # NuGetの脆弱性情報。パッケージのダウンロード用途ではない

# Rust / Cargo
# crates.ioのAPI・パッケージ取得先と、標準のsparse index。
# "crates.io" = "allow"
# "index.crates.io" = "allow"
# "static.crates.io" = "allow"

# Ruby / RubyGems・Bundler
# "rubygems.org" = "allow"

# PHP / Composer・Packagist
# "packagist.org" = "allow"
# "repo.packagist.org" = "allow"

[shell_environment_policy]
# Codexが起動するコマンドへ、親プロセスの環境変数をどこまで渡すか。
# 以下の除外は、秘密値や認証設定の環境変数経由の継承を減らすためのもの。
# 設定ファイル・OSの認証ストア・起動後のシェル設定からの再取得は遮断しない。
# URLやCONFIG全般を一括除外せず、用途が分かる名前を指定する。
# all: すべて引き継ぐ（既定値）。PATHや各種開発ツールの設定をそのまま利用しやすい。
# core: OSやシェルの実行に必要な基本的な環境変数だけを引き継ぐ。
# none: 親プロセスの環境変数を引き継がない。
# 現在は、ローカルの開発ツールを問題なく使えることを優先してallを明示する。
inherit = "all"

# 現行の既定値はtrue。ここではfalseを明示し、変数名にKEY、SECRET、TOKENを含む環境変数を自動的に除外する。
# 判定対象は変数名だけで、変数の内容が秘密情報かどうかは検査しない。
# そのため、別の名前で保存された秘密情報は自動除外されない。
ignore_default_excludes = false

# 既定の変数名フィルターだけでは除外できない秘密情報を追加指定する。
# パターンは大文字・小文字を区別しないglobとして解釈される。
#
# KEY・SECRET・TOKENを含む変数は、上のignore_default_excludes = falseにより
# Codex標準のフィルターですでに除外されるため、ここでは重複指定しない。
#
# 依存関係の復元にプライベートレジストリの認証が必要な場合も、
# 認証情報を常時Codexへ渡すのではなく、必要な作業だけユーザー側で実行するか、
# 用途と対象を限定した別設定で明示的に許可する。
# filtersは環境変数名とinclude/excludeの対応表。旧exclude/include_only配列と同じレイヤーで併用しない。
[shell_environment_policy.filters]
# 一般的な認証・セッション情報
"*PASSWORD*" = "exclude"
"*PASSWD*" = "exclude"
"*CREDENTIAL*" = "exclude"
"*COOKIE*" = "exclude"
"*JWT*" = "exclude"
"*BEARER*" = "exclude"

# データベース・外部サービスの接続情報
"DATABASE_URL" = "exclude"
"REDIS_URL" = "exclude"
"MONGODB_URI" = "exclude"
"*CONNECTION_STRING*" = "exclude"
"*_DSN" = "exclude"
# MYSQL_PWDはPASSWORD/PASSWDのパターンに一致しない。
"MYSQL_PWD" = "exclude"
# 接続URLの名前はアプリごとに異なる。POSTGRES_URLなど、実際に使う名前も必要に応じて追加する。

# Python: pip・uvのURLには認証情報が埋め込まれる場合がある。
# 認証のないミラー指定も除外されるため、専用インデックスを使う環境では取得先を確認する。
"PIP_INDEX_URL" = "exclude"
"PIP_EXTRA_INDEX_URL" = "exclude"
"UV_INDEX_URL" = "exclude"
"UV_EXTRA_INDEX_URL" = "exclude"
"UV_DEFAULT_INDEX" = "exclude"
"UV_INDEX" = "exclude"

# Node.js: npm・Yarnの認証情報
"NPM_CONFIG_*AUTH*" = "exclude"
"YARN_NPM_AUTH_*" = "exclude"

# PHP: Composerの認証情報をJSONで保持する変数
"COMPOSER_AUTH" = "exclude"

# Docker: 環境変数で渡されるレジストリ認証設定
"DOCKER_AUTH_CONFIG" = "exclude"

# Ruby: Bundlerのホスト別認証情報
"BUNDLE_GEMS__*" = "exclude"

# .NET: Azure ArtifactsなどのNuGetフィード認証情報
"VSS_NUGET_EXTERNAL_FEED_ENDPOINTS" = "exclude"

# 認証を含み得る設定ファイルへの参照。秘密値そのものではないが、既定では継承しない。
# 除外するとツールが既定の設定場所へ戻る場合があり、認証を無効化する保証にはならない。
# Kubernetes/Docker等を使う場合は、意図した設定先が変わらないか確認して見直す。
"KUBECONFIG" = "exclude"
"DOCKER_CONFIG" = "exclude"
"NETRC" = "exclude"

# エージェント接続と認証入力用ヘルパーへの参照。値自体は秘密鍵ではない。
# 除外によりGit/SSH認証が使えなくなる場合がある。認証を許可する用途では個別に見直す。
"SSH_AUTH_SOCK" = "exclude"
"SSH_AGENT_PID" = "exclude"
"SSH_ASKPASS" = "exclude"
"GIT_ASKPASS" = "exclude"
"GPG_AGENT_INFO" = "exclude"
